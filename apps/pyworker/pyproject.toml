[project]
name = "modulon-pyworker"
version = "0.1.0"
description = "Internal Python task executor for the Modulon PostgreSQL queue."
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.163.1", "uvicorn==0.54.0", "httpx2==2.16.2", "psycopg==3.3.9", "psycopg-binary==3.3.9", "psycopg-pool==3.3.3"]

[project.optional-dependencies]
dev = ["ruff==0.17.5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
