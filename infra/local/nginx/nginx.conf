user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  # Do not log query strings, cookies or authorization headers.
  log_format safe escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"request_id":"$request_id","request_time":$request_time,'
    '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time"}';
  access_log /dev/stdout safe;
  include /etc/nginx/conf.d/*.conf;
}
