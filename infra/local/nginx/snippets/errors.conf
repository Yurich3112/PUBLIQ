error_page 502 /_proxy/502.html;
error_page 504 /_proxy/504.html;
location = /_proxy/502.html {
  internal;
  root /usr/share/nginx/html;
  add_header Cache-Control no-store always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Request-ID $request_id always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}
location = /_proxy/504.html { internal; root /usr/share/nginx/html; add_header Cache-Control no-store always; }

# Serve assets locally even when the application upstream is down.
location ~ ^/_proxy/(502\.css|theme\.js|bg5xx\.png|logo\.png|favicon\.ico)$ {
  root /usr/share/nginx/html;
  access_log off;
  expires 1h;
  add_header X-Content-Type-Options nosniff always;
}
