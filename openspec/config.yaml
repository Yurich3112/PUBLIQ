schema: spec-driven

context: |
  Project: HackNation 2026 — Inteligentny Asystent Urzędnika (UM Bydgoszcz / Biuro Komunikacji Społecznej).
  Read AGENTS.md and docs/UDIP_COMPLETE_IDEA.md for full domain requirements and mentor decisions.
  Monorepo stack:
  - apps/web: Next.js and TypeScript host the UDIP API, permissions, case workflow, document handling and ranking of anonymized precedents.
  - apps/pyworker: local FastAPI worker for OCR and PII-Tracer suggestions.
  - packages/database: Prisma and PostgreSQL store cases, draft versions and the anonymized knowledge base.
  - Local PLLuM produces validated JSON summaries and helps draft letters with a bounded set of matching excerpts selected by the TypeScript backend.
  Key domain rules:
  - Web app in browser (no .exe), supporting ~800 UDIP requests/year with IDs BKS.IV.1431.<nr>.<rok>.
  - Calendar table displays 10 demo cases (5 Green / 5 Red), remaining days countdown, multi-department alerts, and expandable per-department sub-statuses where clerks can attach PDF/DOCX or paste email text inline.
  - Handwritten/scanned requests open a Split-Screen OCR view with 1:1 word bounding-box highlighting and a 1-click "Wezwanie do uzupełnienia" if illegible.
  - The clerk confirms the sanitized intake copy before local PLLuM produces JSON with topic, tags, questions and periods. TypeScript ranks approved PostgreSQL jsonb precedents per question. The clerk confirms the destination and sends any external message outside the system.
  - Draft from current case replies, display gaps and conflicts, and use archived replies as templates. Track each department separately.
  - After the final edit, review PII-Tracer ranges and obtain supervisor approval for that exact text and redaction version. Export a fresh sanitized TXT and record actual dispatch separately. Preserve manual processing when a model is unavailable.
  - Separate Admin Panel (Panel Admina) for uploading knowledge base documents and visualizing where a newly added document lands in the knowledge graph.

rules:
  proposal:
    - Clearly separate frontend work from backend API and storage work, and identify tasks that touch the local Python worker.
    - Reference the 6 Jury validation tests from the HackNation brief.
  tasks:
    - Group independent frontend and backend work so the team can develop against shared API fixtures, including for split-screen OCR.
